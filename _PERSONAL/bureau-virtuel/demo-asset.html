<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Asset 3D Détaillé</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: #0a0a0a;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #info {
        position: fixed;
        bottom: 20px;
        left: 20px;
        color: #fff;
        font-family: system-ui;
        font-size: 13px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.8);
        padding: 16px 20px;
        border-radius: 10px;
        max-width: 320px;
        line-height: 1.5;
      }
      #info h3 {
        margin-bottom: 8px;
        color: #4a7c59;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="info">
      <h3>Modèle GLTF Pro</h3>
      <strong>Damaged Helmet</strong> — Khronos Group<br />
      PBR complet : albedo, normal, roughness, metallic, AO, emissive<br /><br />
      <em>Ce niveau de détail est atteignable avec des assets GLTF de qualité.</em>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.set(0, 0, 4);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.body.appendChild(renderer.domElement);

      // Post-processing
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(
        new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          0.3,
          0.4,
          0.85,
        ),
      );

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.5;

      // HDRI Environment
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      new RGBELoader().load(
        "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr",
        (texture) => {
          const envMap = pmremGenerator.fromEquirectangular(texture).texture;
          scene.environment = envMap;
          scene.background = new THREE.Color(0x0a0a0a);
          texture.dispose();
        },
      );

      // Subtle ambient
      scene.add(new THREE.AmbientLight(0xffffff, 0.2));

      // Key light
      const key = new THREE.DirectionalLight(0xffffff, 1.5);
      key.position.set(2, 3, 2);
      scene.add(key);

      // Rim light (colored)
      const rim = new THREE.DirectionalLight(0xff6b6b, 0.8);
      rim.position.set(-3, 1, -2);
      scene.add(rim);

      // Fill light (blue)
      const fill = new THREE.DirectionalLight(0x6b9fff, 0.5);
      fill.position.set(-2, -1, 3);
      scene.add(fill);

      // Load the detailed model
      const loader = new GLTFLoader();
      loader.load(
        "models/helmet.glb",
        (gltf) => {
          const model = gltf.scene;
          model.scale.set(1.5, 1.5, 1.5);
          model.position.set(0, 0, 0);
          scene.add(model);
        },
        (progress) => {
          console.log("Loading:", ((progress.loaded / progress.total) * 100).toFixed(0) + "%");
        },
        (error) => {
          console.error("Error loading model:", error);
        },
      );

      // Animation
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        composer.render();
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
