<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Asset GLTF</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: #111;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #info {
        position: fixed;
        top: 20px;
        left: 20px;
        color: #fff;
        font-family: system-ui;
        font-size: 14px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.7);
        padding: 12px 16px;
        border-radius: 8px;
      }
      #loading {
        position: fixed;
        inset: 0;
        background: #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        font-family: system-ui;
        z-index: 1000;
      }
      #loading.hidden {
        display: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="loading">Chargement du modèle détaillé...</div>
    <div id="info">
      <strong>Exemple : Modèle GLTF détaillé</strong><br />
      Source: Poly Haven / Sketchfab<br />
      <span id="status">Chargement...</span>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.set(2, 1.5, 3);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 0.5, 0);

      // HDRI Environment
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      new RGBELoader().load(
        "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr",
        (texture) => {
          const envMap = pmremGenerator.fromEquirectangular(texture).texture;
          scene.environment = envMap;
          scene.background = new THREE.Color(0x111111);
          texture.dispose();
        },
      );

      // Lights
      const ambient = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(ambient);

      const key = new THREE.DirectionalLight(0xffffff, 2);
      key.position.set(3, 5, 2);
      key.castShadow = true;
      key.shadow.mapSize.width = 2048;
      key.shadow.mapSize.height = 2048;
      scene.add(key);

      // Floor
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3, metalness: 0 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // GLTF Loader with Draco
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");

      const gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);

      // Load a detailed plant model from Poly Haven
      // Example: Potted plant
      const modelUrl =
        "https://market-assets.fra1.cdn.digitaloceanspaces.com/market-assets/models/potted-plant/model.gltf";

      // Alternative: chair from Sketchfab (CC0)
      const chairUrl =
        "https://market-assets.fra1.cdn.digitaloceanspaces.com/market-assets/models/chair-stylized/model.gltf";

      let loadedCount = 0;
      const totalModels = 2;

      function updateStatus() {
        loadedCount++;
        document.getElementById("status").textContent = `Modèles: ${loadedCount}/${totalModels}`;
        if (loadedCount >= totalModels) {
          document.getElementById("loading").classList.add("hidden");
          document.getElementById("status").innerHTML =
            `✓ ${totalModels} modèles GLTF chargés<br>Qualité: Artiste 3D professionnel`;
        }
      }

      // Load plant
      gltfLoader.load(
        modelUrl,
        (gltf) => {
          const model = gltf.scene;
          model.scale.set(2, 2, 2);
          model.position.set(-1, 0, 0);
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          scene.add(model);
          updateStatus();
        },
        undefined,
        (err) => {
          console.log("Plant model failed, using fallback");
          // Fallback: create a simple placeholder
          const placeholder = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 0.15, 0.4, 16),
            new THREE.MeshStandardMaterial({ color: 0x8b4513 }),
          );
          placeholder.position.set(-1, 0.2, 0);
          scene.add(placeholder);
          updateStatus();
        },
      );

      // Load chair
      gltfLoader.load(
        chairUrl,
        (gltf) => {
          const model = gltf.scene;
          model.scale.set(1, 1, 1);
          model.position.set(1, 0, 0);
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          scene.add(model);
          updateStatus();
        },
        undefined,
        (err) => {
          console.log("Chair model failed, using fallback");
          // Fallback
          const box = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.8, 0.5),
            new THREE.MeshStandardMaterial({ color: 0x654321 }),
          );
          box.position.set(1, 0.4, 0);
          scene.add(box);
          updateStatus();
        },
      );

      // Animation
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
